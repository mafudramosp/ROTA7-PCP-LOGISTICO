<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Site fora do ar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: #fff;
      text-align: center;
    }

    .container {
      max-width: 500px;
      padding: 40px;
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      animation: fadeIn 1.2s ease;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 15px;
    }

    p {
      font-size: 1.1rem;
      opacity: 0.9;
      margin-bottom: 20px;
    }

    .icon {
      font-size: 60px;
      margin-bottom: 20px;
      animation: float 2s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .btn {
      display: inline-block;
      padding: 12px 25px;
      border-radius: 25px;
      background: #ffffff;
      color: #2a5298;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }

    .btn:hover {
      background: #ddd;
    }

    footer {
      margin-top: 20px;
      font-size: 0.8rem;
      opacity: 0.7;
    }

    footer a {
      color: #fff;
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="icon">⚠️</div>
    <h1>Estamos fora do ar</h1>
    <p>Nosso site está passando por manutenção no momento.</p>
    <p>Voltaremos em breve. Obrigado pela sua paciência!</p>

    <a href="#" class="btn" onclick="location.reload()">Tentar novamente</a>

    <footer>
      © 2026 
      <a href="https://github.com/mafudramosp/programacao-veiculos-gru" target="_blank">
        github.com/mafudramosp/programacao-veiculos-gru
      </a>
    </footer>
  </div>
</body>
</html>
